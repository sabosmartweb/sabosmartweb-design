<script>
(function () {
  function prepararProductos() {
    const categorias = {
      "mundial-camisetas": "Mundial - Camisetas",
      "hogar-y-deco": "Hogar y Deco",
      "cocina": "Cocina",
      "organizadores": "Organizadores",
      "bano": "Baño",
      "navidad": "Navidad"
    };

    document.querySelectorAll(".block-products-feed").forEach(function (seccion) {
      const encabezado = seccion.querySelector(".block-products-feed__heading");
      const titulo = seccion.querySelector(".block-products-feed__title");

      if (encabezado && titulo) {
        titulo.textContent = "Productos destacados";

        let textos = encabezado.querySelector(".sabo-productos-textos");

        if (!textos) {
          const padre = titulo.parentElement;

          if (padre !== encabezado && padre.tagName === "DIV") {
            textos = padre;
            textos.classList.add("sabo-productos-textos");
          } else {
            textos = document.createElement("div");
            textos.className = "sabo-productos-textos";
            encabezado.insertBefore(textos, titulo);
            textos.appendChild(titulo);
          }
        }

        let subtitulo = encabezado.querySelector(".sabo-productos-subtitulo");

        if (!subtitulo) {
          subtitulo = document.createElement("p");
          subtitulo.className = "sabo-productos-subtitulo";
        }

        subtitulo.textContent =
          "Productos para tu hogar, con precio especial por transferencia";
        textos.appendChild(subtitulo);

        let enlace = encabezado.querySelector(".sabo-productos-ver");

        if (!enlace) {
          enlace = document.createElement("a");
          enlace.className = "sabo-productos-ver";
          encabezado.appendChild(enlace);
        }

        enlace.href = "https://sabosmart.com.ar/productos";
        enlace.textContent = "Ver todos los productos";

        seccion.classList.add("sabo-productos-listo");
      }

      seccion.querySelectorAll(".block-products-feed__product").forEach(function (tarjeta) {
        const imagen = tarjeta.querySelector(".block-products-feed__product-media");
        const enlace = tarjeta.querySelector(".block-products-feed__product-link");

        if (!imagen || !enlace) return;

        const ruta = new URL(enlace.href, location.href)
          .pathname.split("/").filter(Boolean);
        const categoria = categorias[ruta[0]];

        if (!categoria) return;

        let etiqueta = imagen.querySelector(".sabo-producto-categoria");

        if (!etiqueta) {
          etiqueta = document.createElement("span");
          etiqueta.className = "sabo-producto-categoria";
          imagen.appendChild(etiqueta);
        }

        etiqueta.textContent = categoria;
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", prepararProductos);
  } else {
    prepararProductos();
  }
})();
</script>

<script>
(function () {
  function prepararFooter() {
    const footer = document.querySelector("footer.footer");
    if (!footer || footer.classList.contains("sabo-footer")) return;

    const columnas = footer.querySelector(".footer__top__items");
    const listaContacto = footer.querySelector(".footer__top__info-list");
    const contacto = listaContacto
      ? listaContacto.closest(".footer__top__item")
      : null;

    if (!columnas || !contacto) return;

    /* Marca y descripción */
    const marca = document.createElement("div");
    marca.className = "footer__top__item";

    marca.innerHTML = `
      <p class="sabo-footer-marca">SABÓ</p>
      <p class="sabo-footer-rubro">HOGAR &amp; DECO</p>
      <p class="sabo-footer-descripcion">
        Productos prácticos y con diseño para tu casa.<br>
        Envíos a todo el país y retiro en Villa Martelli.
      </p>
    `;

    /* Categorías */
    const categorias = document.createElement("div");
    categorias.className = "footer__top__item";

    const titulo = document.createElement("h5");
    titulo.className = "footer__top__title";
    titulo.textContent = "Categorías";

    const lista = document.createElement("ul");
    lista.className = "sabo-footer-categorias";

    const enlaces = document.querySelectorAll(
      ".block-categories-carrousel__link"
    );
    const agregados = new Set();

    enlaces.forEach(function (original) {
      if (agregados.has(original.href)) return;
      agregados.add(original.href);

      const item = document.createElement("li");
      const enlace = document.createElement("a");
      enlace.href = original.href;
      enlace.textContent = original.textContent.trim();

      if (enlace.textContent.toUpperCase() === "NAVIDAD") {
        enlace.textContent = "Navidad";
      }

      item.appendChild(enlace);
      lista.appendChild(item);
    });

    categorias.appendChild(titulo);
    categorias.appendChild(lista);

    /* Reemplazar las columnas visuales anteriores */
    Array.from(columnas.children).forEach(function (columna) {
      if (columna !== contacto) {
        columna.classList.add("sabo-footer-oculto");
      }
    });

    columnas.insertBefore(marca, columnas.firstChild);

    if (lista.children.length) {
      columnas.insertBefore(categorias, contacto);
    }

    /* Mantener los enlaces originales de contacto */
    const ubicacion = document.createElement("li");
    ubicacion.className = "footer__top__info-item";
    ubicacion.textContent = "Villa Martelli, Buenos Aires";

    const arrepentimiento = listaContacto.querySelector(
      ".footer__top__info-item--underline"
    );

    listaContacto.insertBefore(ubicacion, arrepentimiento);

    footer.classList.add("sabo-footer");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", prepararFooter);
  } else {
    prepararFooter();
  }
})();
</script>
